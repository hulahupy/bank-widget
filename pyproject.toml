[tool.poetry]
name = "mask-card-number-9-1"
version = "0.1.0"
description = "Маскировка номеров банковских карт и счетов"
authors = ["Студент <student@example.com>"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.14"

[tool.poetry.group.lint.dependencies]
flake8 = ">=6.0"
black = ">=23.0"
isort = ">=5.12"
mypy = ">=1.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=7.0"

[tool.black]
line-length = 119
exclude = '''
/(
    \.git
)/
'''

[tool.isort]
profile = "black"
line_length = 119
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.mypy]
python_version = "3.14"
disallow_untyped_defs = true
warn_return_any = true
exclude = ["venv"]
namespace_packages = true

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.test.dependencies]
pytest = ">=7.0"
pytest-cov = ">=4.0"  # для измерения покрытия

[tool.coverage.run]
source = ["src"]
omit = ["*/__init__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if __name__ == .__main__.:",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if False:",
]
